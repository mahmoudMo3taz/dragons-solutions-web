# Nginx site for Dragons Solutions. Replace example.com with your domain, then:
#   sudo cp deploy/nginx-dragons-solutions.conf /etc/nginx/sites-available/dragons-solutions
#   sudo ln -s /etc/nginx/sites-available/dragons-solutions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com
# Your other website keeps its own server block; Nginx picks the site by domain name.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
